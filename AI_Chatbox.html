<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: transparent;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="flex items-end justify-end h-screen p-6">
    <div id="aiChatWindow" class="w-full max-w-[380px] h-[580px] bg-[#0d0d0d] border border-white/10 rounded-[28px] shadow-2xl flex flex-col translate-y-0 transition-transform duration-500 ease-out overflow-hidden">
        <!-- Chat Header -->
        <div class="p-6 border-b border-white/5 bg-white/[0.01] flex items-center justify-between backdrop-blur-xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-white/[0.05] border border-white/10 flex items-center justify-center text-white/50 font-bold text-lg">S</div>
                <div class="flex flex-col">
                    <span class="text-white/90 font-bold text-[15px]">Shvetha's AI</span>
                    <span class="text-[10px] text-gray-500 font-medium tracking-wide uppercase opacity-80">Portfolio Assistant</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleVoiceNarrative()" id="headerVoiceBtn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/5 text-gray-500 hover:text-brand-green transition-all" title="Narrate Project">
                    <span id="headerVoiceIcon" class="flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 10v2a7 7 0 0 1-14 0v-2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="19" x2="12" y2="23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="23" x2="16" y2="23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                </button>
                <button onclick="window.parent.postMessage({action: 'closeChat'}, '*')" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/5 text-gray-500 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M6 18L18 6M6 6l12 12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </button>
            </div>
        </div>

        <!-- Messages Area -->
        <div id="chatMessages" class="flex-grow p-6 overflow-y-auto flex flex-col gap-5 scrollbar-thin">
            <!-- Messages go here -->
        </div>

        <!-- Input Area -->
        <div class="p-5 bg-white/[0.01] border-t border-white/5">
            <div class="flex gap-2 relative">
                <input type="text" id="userInput" placeholder="Type your question..." onkeypress="if(event.key==='Enter') sendMessage()" class="w-full bg-white/5 border border-white/5 rounded-full py-3 px-5 pr-12 text-[13px] text-white focus:outline-none focus:border-white/20 placeholder:text-gray-700 transition-all">
                <button onclick="sendMessage()" class="absolute right-1 top-1 w-10 h-10 flex items-center justify-center bg-white/[0.05] rounded-full text-white/50 hover:bg-white/10 hover:text-white transition-all">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M5 12h14M12 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const headerVoiceIcon = document.getElementById('headerVoiceIcon');

        const knowledgeBase = {
            experience: [
                "Shvetha is a Product Designer with 3+ years of experience in building cinematic web and mobile experiences. She loves combining her engineering background with user-centric design.",
                "With 3 years in the design field, Shvetha has a knack for turning complex problems into simple, intuitive solutions.",
                "Shvetha has been designing for 3 years now. She transitioned from engineering to Product Design, focusing on logical yet creative UX."
            ],
            work: [
                "She's currently a UX Designer at Koiostudio (2025). Previously, she was a UX Intern at Mentorsity and has been freelancing since 2022.",
                "Currently, she's contributing as a UX Designer at Koiostudio. Her background includes an internship at Mentorsity and freelance work."
            ],
            problem: [
                "In the 'Financial Decisions' study, Shvetha tackled 'Information Overload'—helping users make choices rather than just seeing data.",
                "The core problem was that budgeting tools often confuse users with too much data. Her solution focuses on guided clarity."
            ],
            skills: [
                "She's an expert in Figma and FigJam, using them for deep UX Research and high-fidelity Prototyping.",
                "Her skill set includes UX Research, UI Design, and Wireframing, bringing 'Decision-First' digital tools to life."
            ],
            who: [
                "I'm Shvetha's dedicated AI assistant! I'm here to provide insights into her design process and experience.",
                "I'm a digital guide to Shvetha's portfolio. I can help you navigate her 3 years of work."
            ],
            greeting: [
                "Hello! What part of Shvetha's journey are you most curious about?",
                "Hi there! Would you like to hear about her latest case study or her overall experience?"
            ],
            default: [
                "That's a great question! I can tell you about Shvetha's 3 years of experience, her role at Koiostudio, or the finance case study.",
                "I'm still learning! But I can share details about Shvetha's design skills or the 'Financial Decisions' project."
            ]
        };

        const suggestionPool = [
            { label: 'Case Study Problem', value: 'Case Study Problem' },
            { label: '3 Years Experience', value: 'Experience' },
            { label: 'Koiostudio Role', value: 'Work at Koiostudio' },
            { label: 'Design Skills', value: 'Skills' },
            { label: 'Mentorsity Internship', value: 'Mentorsity Internship' },
            { label: 'Engineering Background', value: 'Engineering Background' },
            { label: 'Her Design Process', value: 'Process' },
            { label: 'Current Location', value: 'Where is she based?' }
        ];

        let synth = window.speechSynthesis;
        window.currentUtterance = null; // Global to prevent garbage collection

        const narrativeText = "Hi! I'm Shvetha... For this project, I really wanted to solve a problem I've faced myself. Most budgeting apps are just numbers and charts, which can feel really overwhelming for students... So, I reimagined the experience to be what I call 'Decision-First'... Instead of just tracking where your money went, I designed it to guide you toward clear financial choices, like whether you can actually afford that next coffee today... The result? A 40% boost in user engagement. It's not just an app; it's a proactive financial guide that I'm truly proud of.";

        const icons = {
            mic: `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 10v2a7 7 0 0 1-14 0v-2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="19" x2="12" y2="23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="23" x2="16" y2="23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
            play: `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M5 3.868v16.264c0 .88 1.05 1.34 1.706.746l8.846-8.132a1 1 0 0 0 0-1.492L6.706 3.122C6.05 2.528 5 2.988 5 3.868z"/></svg>`,
            pause: `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`
        };

        function getFemaleVoice() {
            const voices = synth.getVoices();
            const searchTerms = ['Zira', 'Aria', 'Samantha', 'Victoria', 'Google US English', 'Female'];
            for (const term of searchTerms) {
                const voice = voices.find(v => v.name.includes(term));
                if (voice) return voice;
            }
            return voices.find(v => v.lang.startsWith('en')) || voices[0];
        }

        function toggleVoiceNarrative() {
            if (synth.speaking && !synth.paused) {
                synth.pause();
                headerVoiceIcon.innerHTML = icons.play;
                parent.postMessage({ action: 'voicePaused' }, '*');
                return;
            }

            if (synth.paused) {
                synth.resume();
                headerVoiceIcon.innerHTML = icons.pause;
                parent.postMessage({ action: 'voiceResumed' }, '*');
                return;
            }

            restartVoiceNarrative();
        }

        function restartVoiceNarrative() {
            if (window.currentUtterance) {
                window.currentUtterance.onend = null;
                window.currentUtterance.onerror = null;
            }
            synth.cancel();
            
            // Wait a tiny bit for the cancel to clear
            setTimeout(() => {
                window.currentUtterance = new SpeechSynthesisUtterance(narrativeText);
                window.currentUtterance.pitch = 1.0;
                window.currentUtterance.rate = 0.92; // Slightly slower for natural feel
                
                const femaleVoice = getFemaleVoice();
                if (femaleVoice) window.currentUtterance.voice = femaleVoice;

                window.currentUtterance.onend = () => {
                   headerVoiceIcon.innerHTML = icons.mic;
                   parent.postMessage({ action: 'voiceEnded' }, '*');
                };

                window.currentUtterance.onerror = (e) => {
                    console.error("Speech Synthesis Error:", e);
                    headerVoiceIcon.innerHTML = icons.mic;
                    parent.postMessage({ action: 'voiceEnded' }, '*');
                };

                synth.speak(window.currentUtterance);
                headerVoiceIcon.innerHTML = icons.pause;
                addMessage("Narrating my project journey... 🎙️");
            }, 100);
        }

        function stopVoiceNarrative() {
            if (window.currentUtterance) {
                window.currentUtterance.onend = null;
                window.currentUtterance.onerror = null;
            }
            synth.cancel();
            headerVoiceIcon.innerHTML = icons.mic;
            parent.postMessage({ action: 'voiceEnded' }, '*');
        }

        // Listen for messages from parent
        window.addEventListener('message', (event) => {
            if (event.data.action === 'startVoiceNarrative') {
                if (!synth.speaking) toggleVoiceNarrative();
                else if (synth.paused) synth.resume();
            } else if (event.data.action === 'pauseVoiceNarrative') {
                if (synth.speaking && !synth.paused) synth.pause();
            } else if (event.data.action === 'resumeVoiceNarrative') {
                if (synth.paused) synth.resume();
            } else if (event.data.action === 'restartVoiceNarrative') {
                restartVoiceNarrative();
            } else if (event.data.action === 'stopVoiceNarrative') {
                stopVoiceNarrative();
            }
        });

        window.speechSynthesis.onvoiceschanged = () => { getFemaleVoice(); };

        function getDynamicSuggestions(currentValue) {
            let filtered = suggestionPool.filter(s => 
                s.value.toLowerCase() !== currentValue.toLowerCase() && 
                s.label.toLowerCase() !== currentValue.toLowerCase()
            );
            return filtered.sort(() => 0.5 - Math.random()).slice(0, 3);
        }

        function addMessage(text, isUser = false, suggestions = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col gap-1.5 ${isUser ? 'self-end items-end' : 'self-start'} max-w-[85%] animate-in fade-in slide-in-from-bottom-2 duration-300`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = `${isUser ? 'bg-white/10 text-white rounded-tr-none' : 'bg-white/[0.03] border border-white/5 text-gray-300 rounded-tl-none'} p-3.5 rounded-[18px] text-[13px] leading-[1.6] shadow-md`;
            contentDiv.innerText = text;
            msgDiv.appendChild(contentDiv);

            if (!isUser && suggestions) {
                const suggestionsDiv = document.createElement('div');
                suggestionsDiv.className = 'flex flex-wrap gap-2 mt-2';
                suggestions.forEach(s => {
                    const btn = document.createElement('button');
                    btn.className = 'px-3 py-1.5 rounded-full border border-white/10 bg-white/5 text-[11px] text-gray-400 hover:border-white/30 hover:text-white transition-all text-left';
                    btn.innerText = s.label;
                    btn.onclick = () => handleSuggestion(s.value);
                    suggestionsDiv.appendChild(btn);
                });
                msgDiv.appendChild(suggestionsDiv);
            }
            
            const metaSpan = document.createElement('span');
            metaSpan.className = 'text-[9px] text-gray-700 font-medium px-1 mt-1';
            metaSpan.innerText = isUser ? 'You · Just now' : 'AI · Just now';
            msgDiv.appendChild(metaSpan);
            
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleSuggestion(text) { sendMessage(text); }

        function sendMessage(customText = null) {
            const text = customText || userInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            if (!customText) userInput.value = '';

            const typingDiv = document.createElement('div');
            typingDiv.className = 'flex self-start p-3 bg-white/[0.02] rounded-full px-5 text-gray-600 text-[11px] animate-pulse';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerText = 'thinking...';
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            setTimeout(() => {
                const indicator = document.getElementById('typingIndicator');
                if (indicator) indicator.remove();
                
                let category = 'default';
                const lowerText = text.toLowerCase();
                if (lowerText.includes('experience')) category = 'experience';
                else if (lowerText.includes('work') || lowerText.includes('koiostudio')) category = 'work';
                else if (lowerText.includes('problem')) category = 'problem';
                else if (lowerText.includes('skill')) category = 'skills';
                else if (lowerText.includes('who')) category = 'who';
                else if (lowerText.includes('hi') || lowerText.includes('hello')) category = 'greeting';

                const responses = knowledgeBase[category];
                const reply = responses[Math.floor(Math.random() * responses.length)];
                
                const newSuggestions = getDynamicSuggestions(text);
                addMessage(reply, false, newSuggestions);
            }, 1000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const welcomeSuggestions = suggestionPool.sort(() => 0.5 - Math.random()).slice(0, 3);
                addMessage("Hi! I'm Shvetha's AI assistant. I can help you walk through her portfolio, explain the design process behind her projects, or share more about her 3-year journey. What would you like to explore?", false, welcomeSuggestions);
            }, 500);
        });
    </script>
</body>
</html>
