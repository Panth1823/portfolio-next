<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: transparent;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 4px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* Mic recording pulse */
        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
        }
        .mic-recording {
            animation: micPulse 1.2s ease-in-out infinite;
            background: rgba(239, 68, 68, 0.2) !important;
            color: #ef4444 !important;
            border-color: rgba(239, 68, 68, 0.3) !important;
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        // ═══════════════════════════════════════════════════════════════
        // INTELLIGENT KEYWORD MATCHING ENGINE
        // ═══════════════════════════════════════════════════════════════

        function analyzeQuery(query) {
            const lowerQuery = query.toLowerCase().trim();
            const queryWords = lowerQuery.split(/\s+/);
            let bestCategory = null;
            let bestScore = 0;

            for (const [categoryName, categoryData] of Object.entries(knowledgeBase)) {
                if (categoryName === 'default') continue;

                let score = 0;
                const keywords = categoryData.keywords;
                const weight = categoryData.weight || 1;

                for (const keyword of keywords) {
                    const lowerKeyword = keyword.toLowerCase();

                    // Exact phrase match (highest priority)
                    if (lowerQuery.includes(lowerKeyword)) {
                        const wordCount = lowerKeyword.split(/\s+/).length;
                        score += (2 + wordCount) * weight;
                    }

                    // Partial / fuzzy word match
                    for (const word of queryWords) {
                        if (word.length >= 3 && lowerKeyword.includes(word)) {
                            score += 1 * weight;
                        }
                        if (lowerKeyword.length >= 3 && word.includes(lowerKeyword)) {
                            score += 0.8 * weight;
                        }
                    }
                }

                if (score > bestScore) {
                    bestScore = score;
                    bestCategory = categoryName;
                }
            }

            return bestScore > 0 ? bestCategory : 'default';
        }

        function getResponse(query) {
            const category = analyzeQuery(query);
            const categoryData = knowledgeBase[category];
            const responses = categoryData.responses;
            return responses[Math.floor(Math.random() * responses.length)];
        }

        // ═══════════════════════════════════════════════════════════════
        // MICROPHONE INPUT — Web Speech API
        // ═══════════════════════════════════════════════════════════════

        let recognition = null;
        let isListening = false;

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.warn('Speech Recognition not supported in this browser.');
                return false;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = true;
            recognition.continuous = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('micBtn').classList.add('mic-recording');
                document.getElementById('micStatus').textContent = '🎤 Listening... speak now';
                document.getElementById('micStatus').style.color = '#ef4444';
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                userInput.value = transcript;

                // If it's a final result, auto-send
                if (event.results[event.results.length - 1].isFinal) {
                    setTimeout(() => {
                        sendMessage();
                    }, 300);
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                stopMicInput();
                if (event.error === 'not-allowed') {
                    document.getElementById('micStatus').textContent = '⚠️ Mic access denied. Check browser permissions.';
                } else if (event.error === 'no-speech') {
                    document.getElementById('micStatus').textContent = 'No speech detected. Try again.';
                } else {
                    document.getElementById('micStatus').textContent = 'Mic error. Try again.';
                }
                setTimeout(() => {
                    document.getElementById('micStatus').textContent = '';
                }, 3000);
            };

            recognition.onend = () => {
                stopMicInput();
            };

            return true;
        }

        function toggleMicInput() {
            if (isListening) {
                recognition.stop();
                stopMicInput();
                return;
            }

            if (!recognition) {
                const supported = initSpeechRecognition();
                if (!supported) {
                    document.getElementById('micStatus').textContent = '⚠️ Voice input not supported in this browser.';
                    setTimeout(() => {
                        document.getElementById('micStatus').textContent = '';
                    }, 3000);
                    return;
                }
            }

            userInput.value = '';
            recognition.start();
        }

        function stopMicInput() {
            isListening = false;
            document.getElementById('micBtn').classList.remove('mic-recording');
            document.getElementById('micStatus').textContent = '';
            document.getElementById('micStatus').style.color = '';
        }

        let synth = window.speechSynthesis;
        window.currentUtterance = null;

        const narrativeText = "Hi! I'm Shvetha... For this project, I really wanted to solve a problem I've faced myself. Most budgeting apps are just numbers and charts, which can feel really overwhelming for students... So, I reimagined the experience to be what I call 'Decision-First'... Instead of just tracking where your money went, I designed it to guide you toward clear financial choices, like whether you can actually afford that next coffee today... The result? A 40% boost in user engagement. It's not just an app; it's a proactive financial guide that I'm truly proud of.";

        const icons = {
            mic: `<img src="/images/weui_voice-outlined.png" alt="Volume" class="w-5 h-5 opacity-70" style="filter: brightness(0) invert(1);" />`,
            play: `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M5 3.868v16.264c0 .88 1.05 1.34 1.706.746l8.846-8.132a1 1 0 0 0 0-1.492L6.706 3.122C6.05 2.528 5 2.988 5 3.868z"/></svg>`,
            pause: `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`
        };

        function getFemaleVoice() {
            const voices = synth.getVoices();
            const searchTerms = ['Zira', 'Aria', 'Samantha', 'Victoria', 'Google US English', 'Female'];
            for (const term of searchTerms) {
                const voice = voices.find(v => v.name.includes(term));
                if (voice) return voice;
            }
            return voices.find(v => v.lang.startsWith('en')) || voices[0];
        }

        function toggleVoiceNarrative() {
            if (synth.speaking && !synth.paused) {
                synth.pause();
                headerVoiceIcon.innerHTML = icons.play;
                parent.postMessage({ action: 'voicePaused' }, '*');
                return;
            }
            if (synth.paused) {
                synth.resume();
                headerVoiceIcon.innerHTML = icons.pause;
                parent.postMessage({ action: 'voiceResumed' }, '*');
                return;
            }
            restartVoiceNarrative();
        }

        function restartVoiceNarrative() {
            if (window.currentUtterance) {
                window.currentUtterance.onend = null;
                window.currentUtterance.onerror = null;
            }
            synth.cancel();
            setTimeout(() => {
                window.currentUtterance = new SpeechSynthesisUtterance(narrativeText);
                window.currentUtterance.pitch = 1.0;
                window.currentUtterance.rate = 0.92;
                const femaleVoice = getFemaleVoice();
                if (femaleVoice) window.currentUtterance.voice = femaleVoice;
                window.currentUtterance.onend = () => {
                    headerVoiceIcon.innerHTML = icons.mic;
                    parent.postMessage({ action: 'voiceEnded' }, '*');
                };
                window.currentUtterance.onerror = (e) => {
                    console.error("Speech Synthesis Error:", e);
                    headerVoiceIcon.innerHTML = icons.mic;
                    parent.postMessage({ action: 'voiceEnded' }, '*');
                };
                synth.speak(window.currentUtterance);
                headerVoiceIcon.innerHTML = icons.pause;
                addMessage("Narrating my project journey... 🎙️");
            }, 100);
        }

        function stopVoiceNarrative() {
            if (window.currentUtterance) {
                window.currentUtterance.onend = null;
                window.currentUtterance.onerror = null;
            }
            synth.cancel();
            if (headerVoiceIcon) headerVoiceIcon.innerHTML = icons.mic;
            parent.postMessage({ action: 'voiceEnded' }, '*');
        }

        // Listen for messages from parent
        window.addEventListener('message', (event) => {
            if (event.data.action === 'startVoiceNarrative') {
                if (!synth.speaking) toggleVoiceNarrative();
                else if (synth.paused) synth.resume();
            } else if (event.data.action === 'pauseVoiceNarrative') {
                if (synth.speaking && !synth.paused) synth.pause();
            } else if (event.data.action === 'resumeVoiceNarrative') {
                if (synth.paused) synth.resume();
            } else if (event.data.action === 'restartVoiceNarrative') {
                restartVoiceNarrative();
            } else if (event.data.action === 'stopVoiceNarrative') {
                stopVoiceNarrative();
            }
        });

        window.speechSynthesis.onvoiceschanged = () => { getFemaleVoice(); };

        // ═══════════════════════════════════════════════════════════════
        // CHAT UI — messages, suggestions, typing
        // ═══════════════════════════════════════════════════════════════

        let askedTopics = new Set();

        function getDynamicSuggestions(currentValue) {
            askedTopics.add(currentValue.toLowerCase());

            let filtered = suggestionPool.filter(s =>
                !askedTopics.has(s.value.toLowerCase()) &&
                s.value.toLowerCase() !== currentValue.toLowerCase() &&
                s.label.toLowerCase() !== currentValue.toLowerCase()
            );

            if (filtered.length < 3) {
                filtered = suggestionPool.filter(s =>
                    s.value.toLowerCase() !== currentValue.toLowerCase()
                );
            }

            return filtered.sort(() => 0.5 - Math.random()).slice(0, 3);
        }

        function addMessage(text, isUser = false, suggestions = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col gap-1.5 ${isUser ? 'self-end items-end' : 'self-start'} max-w-[85%]`;
            msgDiv.style.animation = 'fadeSlideIn 0.35s cubic-bezier(0.23,1,0.32,1) both';

            const contentDiv = document.createElement('div');
            contentDiv.className = `${isUser ? 'bg-white/10 text-white rounded-tr-none' : 'bg-white/[0.03] border border-white/5 text-gray-300 rounded-tl-none'} p-3.5 rounded-[18px] text-[13px] leading-[1.6] shadow-md`;

            contentDiv.innerHTML = text.replace(/\n/g, '<br>');
            msgDiv.appendChild(contentDiv);

            if (!isUser && suggestions) {
                const suggestionsDiv = document.createElement('div');
                suggestionsDiv.className = 'flex flex-wrap gap-2 mt-2';
                suggestions.forEach(s => {
                    const btn = document.createElement('button');
                    btn.className = 'px-3 py-1.5 rounded-full border border-white/10 bg-white/5 text-[11px] text-gray-400 hover:border-white/30 hover:text-white transition-all text-left';
                    btn.innerText = s.label;
                    btn.onclick = () => handleSuggestion(s.value);
                    suggestionsDiv.appendChild(btn);
                });
                msgDiv.appendChild(suggestionsDiv);
            }

            const metaSpan = document.createElement('span');
            metaSpan.className = 'text-[9px] text-gray-700 font-medium px-1 mt-1';
            metaSpan.innerText = isUser ? 'You · Just now' : 'AI · Just now';
            msgDiv.appendChild(metaSpan);

            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleSuggestion(text) { sendMessage(text); }

        function sendMessage(customText = null) {
            const text = customText || userInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            if (!customText) userInput.value = '';

            const typingDiv = document.createElement('div');
            typingDiv.className = 'flex self-start p-3 bg-white/[0.02] rounded-full px-5 text-gray-600 text-[11px] animate-pulse';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerText = 'thinking...';
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const delay = 400 + Math.random() * 400;

            setTimeout(() => {
                const indicator = document.getElementById('typingIndicator');
                if (indicator) indicator.remove();

                const reply = getResponse(text);
                const newSuggestions = getDynamicSuggestions(text);
                addMessage(reply, false, newSuggestions);
            }, delay);
        }

        // ═══════════════════════════════════════════════════════════════
        // INITIALIZATION
        // ═══════════════════════════════════════════════════════════════

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const welcomeSuggestions = suggestionPool.sort(() => 0.5 - Math.random()).slice(0, 3);
                addMessage("Hi! 👋 I'm Shvetha's AI assistant. Ask me about her projects, skills, experience, or just say hello!", false, welcomeSuggestions);
            }, 500);
        });
    </script>
</body>

</html>
